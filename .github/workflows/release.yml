name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply and release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    name: Bump version and push release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Require main branch
        run: test "$GITHUB_REF_NAME" = main

      - name: Bump, commit, tag, and push
        id: bump
        run: |
          version="$(node scripts/bump-version.mjs "${{ inputs.bump }}" --write)"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists on origin." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not check whether tag $tag exists on origin." >&2
              exit "$status"
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release $tag"
          git tag -a "$tag" -m "Helios $tag"
          git push --atomic origin HEAD:main "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows x64 installer
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install npm dependencies
        run: npm ci

      - name: Check release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoText -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'Cargo.toml version is missing.' }
          $cargoVersion = $Matches[1]
          if (($packageVersion -ne $tauriVersion) -or ($packageVersion -ne $cargoVersion)) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }
          $tag = $env:RELEASE_TAG
          if (-not $tag.StartsWith('v')) { throw "Release tag must start with v: $tag" }
          $tagVersion = $tag.Substring(1)
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match project version $packageVersion."
          }

      - name: Type-check
        run: npx.cmd tsc --noEmit

      - name: Test
        run: npm test

      - name: Download and verify aria2-next sidecar and licenses
        shell: pwsh
        run: ./scripts/prepare-aria2-next.ps1

      - name: Verify aria2-next RPC compatibility
        run: node scripts/smoke-aria2-next.mjs

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm.cmd run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helios-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attest and draft release
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - name: Download built installer
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: helios-installer
          path: release-artifacts

      - name: Set installer path
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release-artifacts -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($installers.Count)." }
          $signature = Get-Item -LiteralPath "$($installers[0].FullName).sig" -ErrorAction Stop
          "INSTALLER_PATH=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNATURE_PATH=$($signature.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -NoNewline -Encoding ascii
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-artifacts/*.exe

      - name: Create updater manifest
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          $signature = (Get-Content -LiteralPath $env:SIGNATURE_PATH -Raw).Trim()
          $version = $env:RELEASE_TAG.Substring(1)
          $asset = [uri]::EscapeDataString($installer.Name)
          $manifest = @{
            version = $version
            notes = "Helios $version"
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$asset"
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Set-Content -LiteralPath release-artifacts/latest.json -Encoding utf8

          $escapedVersion = [regex]::Escape($version)
          $changelog = Get-Content CHANGELOG.md -Raw
          $releaseNotes = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
          if (-not $releaseNotes.Success) { throw "CHANGELOG.md has no section for $version." }
          $releaseNotes.Value.Trim() | Set-Content -LiteralPath release-artifacts/release-notes.md -Encoding utf8

      - name: Upload final installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helios-installer-final
          path: |
            release-artifacts/*.exe
            release-artifacts/*.exe.sha256
            release-artifacts/*.exe.sig
            release-artifacts/latest.json
            release-artifacts/release-notes.md
          if-no-files-found: error
          compression-level: 0

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseList = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $existingRelease = @($releaseList | ConvertFrom-Json | Where-Object tagName -eq $env:RELEASE_TAG)
          if ($existingRelease.Count -gt 0) {
            gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH $env:CHECKSUM_PATH $env:SIGNATURE_PATH release-artifacts/latest.json --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the existing release assets.' }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file release-artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the release notes.' }
          } else {
            gh release create $env:RELEASE_TAG $env:INSTALLER_PATH $env:CHECKSUM_PATH $env:SIGNATURE_PATH release-artifacts/latest.json --repo $env:GITHUB_REPOSITORY --draft --notes-file release-artifacts/release-notes.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          }
